<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
    .tick { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
    .bar-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
    .bar-text-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
    .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
    .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4,4; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff" rx="8" />
  
  <text x="40" y="45" class="title">Missing Value Analysis by Feature</text>
  <text x="40" y="68" class="subtitle">Count of missing entries across all 21 dataset columns (N = 7,043)</text>
  
  <!-- Grid -->
  <line x1="180" y1="90" x2="180" y2="340" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="180" y1="340" x2="720" y2="340" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="315" y1="90" x2="315" y2="340" class="grid" />
  <line x1="450" y1="90" x2="450" y2="340" class="grid" />
  <line x1="585" y1="90" x2="585" y2="340" class="grid" />
  <line x1="720" y1="90" x2="720" y2="340" class="grid" />

  <!-- Ticks -->
  <text x="180" y="360" text-anchor="middle" class="tick">0</text>
  <text x="315" y="360" text-anchor="middle" class="tick">3</text>
  <text x="450" y="360" text-anchor="middle" class="tick">6</text>
  <text x="585" y="360" text-anchor="middle" class="tick">9</text>
  <text x="720" y="360" text-anchor="middle" class="tick">12</text>
  <text x="450" y="390" text-anchor="middle" class="axis-label">Missing Value Count</text>

  <!-- TotalCharges Bar (11 missing) -->
  <text x="165" y="130" text-anchor="end" class="axis-label">TotalCharges</text>
  <rect x="180" y="110" width="495" height="32" fill="#ef4444" rx="4" />
  <text x="685" y="130" text-anchor="start" class="bar-text-dark">11 (0.16% - Tenure = 0)</text>

  <!-- Other columns (0 missing) -->
  <text x="165" y="180" text-anchor="end" class="tick">MonthlyCharges</text>
  <rect x="180" y="165" width="2" height="24" fill="#10b981" />
  <text x="190" y="182" class="tick">0 (0.00%)</text>

  <text x="165" y="225" text-anchor="end" class="tick">tenure</text>
  <rect x="180" y="210" width="2" height="24" fill="#10b981" />
  <text x="190" y="227" class="tick">0 (0.00%)</text>

  <text x="165" y="270" text-anchor="end" class="tick">Contract</text>
  <rect x="180" y="255" width="2" height="24" fill="#10b981" />
  <text x="190" y="272" class="tick">0 (0.00%)</text>

  <text x="165" y="315" text-anchor="end" class="tick">Remaining 17 Columns</text>
  <rect x="180" y="300" width="2" height="24" fill="#10b981" />
  <text x="190" y="317" class="tick">0 (0.00%) - 100% Complete</text>
  
</svg>