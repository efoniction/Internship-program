<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
    .tick { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
    .bar-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
    .bar-text-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
    .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
    .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4,4; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff" rx="8" />
  
  <text x="40" y="45" class="title">Customer Churn Rate by Contract Commitment</text>
  <text x="40" y="68" class="subtitle">Comparison of churn propensity across Month-to-Month, 1-Year, and 2-Year contracts</text>

  <!-- Grid lines -->
  <line x1="80" y1="320" x2="720" y2="320" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="80" y1="265" x2="720" y2="265" class="grid" />
  <line x1="80" y1="210" x2="720" y2="210" class="grid" />
  <line x1="80" y1="155" x2="720" y2="155" class="grid" />
  <line x1="80" y1="100" x2="720" y2="100" class="grid" />

  <!-- Y Ticks -->
  <text x="70" y="324" text-anchor="end" class="tick">0%</text>
  <text x="70" y="269" text-anchor="end" class="tick">15%</text>
  <text x="70" y="214" text-anchor="end" class="tick">30%</text>
  <text x="70" y="159" text-anchor="end" class="tick">45%</text>
  <text x="70" y="104" text-anchor="end" class="tick">60%</text>
  <text x="35" y="200" transform="rotate(-90, 35, 200)" text-anchor="middle" class="axis-label">Churn Rate (%)</text>

  <!-- Bar 1: Month-to-Month (42.71%) -> height: 42.71/60 * 220 = 156.6px, y = 320 - 156.6 = 163.4 -->
  <rect x="140" y="163" width="130" height="157" fill="#ef4444" rx="6" />
  <text x="205" y="150" text-anchor="middle" class="bar-text-dark" font-size="14">42.7%</text>
  <text x="205" y="190" text-anchor="middle" class="bar-text">1,655 / 3,875</text>
  <text x="205" y="345" text-anchor="middle" class="axis-label">Month-to-month</text>

  <!-- Bar 2: One year (11.27%) -> height: 11.27/60 * 220 = 41.3px, y = 320 - 41.3 = 278.7 -->
  <rect x="340" y="279" width="130" height="41" fill="#3b82f6" rx="6" />
  <text x="405" y="268" text-anchor="middle" class="bar-text-dark" font-size="14">11.3%</text>
  <text x="405" y="302" text-anchor="middle" class="bar-text">166 / 1,473</text>
  <text x="405" y="345" text-anchor="middle" class="axis-label">One year</text>

  <!-- Bar 3: Two year (2.83%) -> height: 2.83/60 * 220 = 10.4px, y = 320 - 10.4 = 309.6 -->
  <rect x="540" y="310" width="130" height="10" fill="#10b981" rx="4" />
  <text x="605" y="298" text-anchor="middle" class="bar-text-dark" font-size="14">2.8%</text>
  <text x="605" y="345" text-anchor="middle" class="axis-label">Two year</text>
  <text x="605" y="365" text-anchor="middle" class="tick">(48 / 1,695)</text>

  <!-- Annotation badge -->
  <rect x="420" y="90" width="280" height="50" fill="#fef2f2" stroke="#fca5a5" rx="6" />
  <text x="430" y="112" class="tick" font-weight="bold" fill="#b91c1c">Key Takeaway:</text>
  <text x="430" y="128" class="tick" fill="#7f1d1d">Month-to-month users churn at 15x the rate of 2-year users!</text>
  
</svg>